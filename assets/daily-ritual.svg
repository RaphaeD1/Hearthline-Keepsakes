<svg xmlns="http://www.w3.org/2000/svg" width="2550" height="3300" viewBox="0 0 2550 3300" role="img" aria-labelledby="title desc"><title id="title">Slow Morning daily planner</title><desc id="desc">Original US Letter daily planner with date, three priorities, a schedule, notes and a gratitude prompt. Printable layout preview.</desc><rect width="2550" height="3300" fill="#fffdf9"/><g fill="#34342f" font-family="Georgia,serif"><text x="190" y="300" font-size="120">A slower kind of day.</text><text x="195" y="405" font-size="42" letter-spacing="5">SLOW MORNING · DAILY PLANNER</text></g><g fill="#57564f" font-family="sans-serif" font-size="44"><text x="190" y="570">DATE</text><text x="190" y="790">THREE THINGS THAT MATTER</text><text x="190" y="1390">ROOM FOR THE DAY</text><text x="1390" y="1390">NOTES &amp; LITTLE IDEAS</text><text x="190" y="2850">ONE GOOD THING TODAY</text></g><g fill="none" stroke="#a68d7d" stroke-width="4"><path d="M390 575 H1120"/><rect x="195" y="885" width="55" height="55" rx="9"/><path d="M310 940 H2350"/><rect x="195" y="1045" width="55" height="55" rx="9"/><path d="M310 1100 H2350"/><rect x="195" y="1205" width="55" height="55" rx="9"/><path d="M310 1260 H2350"/><path d="M360 1530 H1190 M1390 1530 H2350"/><path d="M360 1670 H1190 M1390 1670 H2350"/><path d="M360 1810 H1190 M1390 1810 H2350"/><path d="M360 1950 H1190 M1390 1950 H2350"/><path d="M360 2090 H1190 M1390 2090 H2350"/><path d="M360 2230 H1190 M1390 2230 H2350"/><path d="M360 2370 H1190 M1390 2370 H2350"/><path d="M360 2510 H1190 M1390 2510 H2350"/><path d="M190 3020 H2350"/></g><text x="1275" y="3190" text-anchor="middle" font-family="sans-serif" font-size="30" letter-spacing="6" fill="#57564f">HEARTHLINE KEEPSAKES</text></svg>